name: Update and deploy

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths: ["data/snapshots/**", "data/filmweb-map.json", "scripts/**", "docs/**", ".github/workflows/update.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s scripts
      - name: Compute changes
        run: python scripts/diff.py
      - name: Fetch Polish release dates from Filmweb
        continue-on-error: true
        run: python scripts/filmweb.py
      - name: Check Polish streaming and VOD availability
        continue-on-error: true
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python scripts/availability.py
      - name: Commit regenerated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/tmdb-map.json
          git diff --cached --quiet || git commit -m "Update data $(date -u +%F)"
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
